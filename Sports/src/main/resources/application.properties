spring.application.name=Sports

spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.linger.ms=0

spring.kafka.producer.properties.retry.backoff.ms=1000

# Metadata timeout (how long to look for the broker)
spring.kafka.producer.properties.max.block.ms=5000

# Total delivery timeout
spring.kafka.producer.properties.delivery.timeout.ms=10000

# Disable internal Kafka retries because @Retryable is doing the work now
spring.kafka.producer.retries=0

# Serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Keeps JSON portable across different applications
spring.kafka.producer.properties.spring.json.add.type.headers=false